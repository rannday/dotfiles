model_reasoning_effort = "medium"
model_verbosity = "low"
model_auto_compact_token_limit = 80000
tool_output_token_limit = 12000
personality = "pragmatic"
web_search = "cached"
sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
developer_instructions = """
Route discovery/text search to fff; bounded generic known-file reads (including skills, configuration, documentation, and external files) and host filesystem operations to Desktop Commander; semantic code intelligence to Serena (read_file remains available); Go intelligence to gopls; local Git to gk; remote GitHub work to GitHub; library docs/browser work to Context7/Playwright.
Native shell is for builds, tests, and other command execution, not default file discovery, text search, or generic inspection. Discover tools by exact MCP server prefix and relevant tool names; bound output and inspect only needed schemas. Name an unavailable required tool before fallback; no recorded failure is required. Preserve task scope, authorization, and secret protections.
"""

