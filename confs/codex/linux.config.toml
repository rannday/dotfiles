model = "gpt-6-astra"
model_reasoning_effort = "high"
model_verbosity = "low"
model_auto_compact_token_limit = 80000
tool_output_token_limit = 12000
personality = "pragmatic"
web_search = "cached"
default_permissions = "workspace-git"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
developer_instructions = """
Follow ~/.codex/AGENTS.md for voice, tool routing, bounded discovery, permitted fallbacks, authorization, and secret protection.
"""

[tui]
theme = "gruvbox-dark"

[notice]
hide_rate_limit_model_nudge = true

[features]
fast_mode = false
shell_snapshot = true
multi_agent = true
memories = true

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "medium"

# Codex CLI 0.163.0+: workspace sandbox with writable Git metadata.
[permissions.workspace-git]
extends = ":workspace"

[permissions.workspace-git.filesystem]
"~/.cache/go-build" = "write"
"~/go/tmp" = "write"
"~/go/pkg/mod" = "write"

[permissions.workspace-git.filesystem.":workspace_roots"]
".git" = "write"

[permissions.workspace-git.network]
enabled = true

[mcp_servers.fff]
command = "fff-mcp"
enabled = true
default_tools_approval_mode = "approve"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
bearer_token_env_var = "CONTEXT7_API_KEY"
default_tools_approval_mode = "approve"

[mcp_servers.sqlite_logs]
command = "uvx"
args = [
  "mcp-server-sqlite",
  "--db-path",
  "/home/rann/.codex/logs_2.sqlite",
]
enabled_tools = ["read_query", "list_tables", "describe_table"]

[mcp_servers.gopls]
default_tools_approval_mode = "prompt"
command = "gopls"
args = ["mcp"]
startup_timeout_sec = 90

# Inspection and checks are approved; rename requests and unknown tools prompt.
[mcp_servers.gopls.tools]
go_diagnostics = { approval_mode = "approve" }
go_file_context = { approval_mode = "approve" }
go_package_api = { approval_mode = "approve" }
go_search = { approval_mode = "approve" }
go_symbol_references = { approval_mode = "approve" }
go_vulncheck = { approval_mode = "approve" }
go_workspace = { approval_mode = "approve" }

[mcp_servers.serena]
default_tools_approval_mode = "prompt"
command = "serena"
args = ["start-mcp-server", "--project-from-cwd", "--context=/home/rann/.codex/serena-context.yml"]
startup_timeout_sec = 90
disabled_tools = ["activate_project"]

[mcp_servers.serena.tools]
initial_instructions = { approval_mode = "approve" }
check_onboarding_performed = { approval_mode = "approve" }
get_current_config = { approval_mode = "approve" }
list_memories = { approval_mode = "approve" }
read_memory = { approval_mode = "approve" }
read_file = { approval_mode = "approve" }
get_symbols_overview = { approval_mode = "approve" }
find_symbol = { approval_mode = "approve" }
find_referencing_symbols = { approval_mode = "approve" }
find_declaration = { approval_mode = "approve" }
find_implementations = { approval_mode = "approve" }
get_diagnostics_for_file = { approval_mode = "approve" }

#[mcp_servers.playwright]
