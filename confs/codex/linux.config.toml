[features]
fast_mode = false
shell_snapshot = true
multi_agent = true
memories = true

[agents]
enabled = true
max_concurrent_threads_per_session = 3

[sandbox_workspace_write]
network_access = true
writable_roots = [
  "/home/rann/.cache/go-build",
  "/home/rann/go/tmp",
  "/home/rann/go/pkg/mod",
]

[mcp_servers.github]
default_tools_approval_mode = "prompt"
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PAT_TOKEN"

[mcp_servers.github.http_headers]
X-MCP-Toolsets = "context,repos,issues,pull_requests,users,actions"
X-MCP-Exclude-Tools = "merge_pull_request,delete_repository,delete_file,push_files,create_or_update_file,create_branch,create_repository,fork_repository,update_pull_request_branch,actions_run_trigger"

# https://github.com/microsoft/playwright-mcp
[mcp_servers.playwright]
default_tools_approval_mode = "prompt"
command = "npx"
args = ["-y", "@playwright/mcp@latest"]

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
bearer_token_env_var = "CONTEXT7_API_KEY"
default_tools_approval_mode = "approve"

[mcp_servers.fff]
command = "fff-mcp"
enabled = true
default_tools_approval_mode = "approve"

[mcp_servers.gk]
default_tools_approval_mode = "prompt"
command = "gk"
args = ["mcp"]
disabled_tools = [
  "app_update_user_preferences",
  "git_commit_composer",
  "git_resolve",
  "gitkraken_workspace_list",
  "gitlens_launchpad",
  "gitlens_start_review",
  "gitlens_start_work",
  "issues_add_comment",
  "issues_assigned_to_me",
  "issues_create",
  "issues_get_detail",
  "pull_request_assigned_to_me",
  "pull_request_create",
  "pull_request_create_review",
  "pull_request_get_comments",
  "pull_request_get_detail",
  "repository_get_file_content",
]

[mcp_servers.gopls]
default_tools_approval_mode = "approve"
command = "gopls"
args = ["mcp"]
startup_timeout_sec = 90

[mcp_servers.serena]
default_tools_approval_mode = "prompt"
command = "serena"
args = ["start-mcp-server", "--project-from-cwd", "--context=/home/rann/.codex/serena-context.yml"]
startup_timeout_sec = 90
disabled_tools = ["activate_project"]

