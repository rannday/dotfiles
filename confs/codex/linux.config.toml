#command = "npx"
#args = ["-y", "@playwright/mcp@latest"]

[mcp_servers.filesystem]
default_tools_approval_mode = "prompt"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "/home/rann"]

# Read-only tools are approved; mutations and unknown tools prompt.
[mcp_servers.filesystem.tools]
edit_file = { approval_mode = "prompt" }
write_file = { approval_mode = "prompt" }
create_directory = { approval_mode = "prompt" }
move_file = { approval_mode = "prompt" }
read_file = { approval_mode = "approve" }
read_text_file = { approval_mode = "approve" }
read_media_file = { approval_mode = "approve" }
read_multiple_files = { approval_mode = "approve" }
list_directory = { approval_mode = "approve" }
list_directory_with_sizes = { approval_mode = "approve" }
directory_tree = { approval_mode = "approve" }
search_files = { approval_mode = "approve" }
get_file_info = { approval_mode = "approve" }
list_allowed_directories = { approval_mode = "approve" }

[mcp_servers.git]
default_tools_approval_mode = "prompt"
command = "uvx"
args = ["mcp-server-git"]

[mcp_servers.git.tools]
git_status = { approval_mode = "approve" }
git_diff_unstaged = { approval_mode = "approve" }
git_diff_staged = { approval_mode = "approve" }
git_diff = { approval_mode = "approve" }
git_log = { approval_mode = "approve" }
git_show = { approval_mode = "approve" }
git_branch = { approval_mode = "approve" }
git_add = { approval_mode = "prompt" }
git_commit = { approval_mode = "prompt" }
git_reset = { approval_mode = "prompt" }
git_create_branch = { approval_mode = "prompt" }
git_checkout = { approval_mode = "prompt" }

[mcp_servers.fetch]
default_tools_approval_mode = "prompt"
command = "uvx"
args = ["mcp-server-fetch"]

[mcp_servers.github]
default_tools_approval_mode = "prompt"
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PAT_TOKEN"

[mcp_servers.github.http_headers]
X-MCP-Toolsets = "context,repos,issues,pull_requests,users,actions"
X-MCP-Exclude-Tools = "merge_pull_request,delete_repository,delete_file,push_files,create_or_update_file,create_branch,create_repository,fork_repository,update_pull_request_branch,actions_run_trigger"

[mcp_servers.github.tools]
get_commit = { approval_mode = "approve" }
get_file_contents = { approval_mode = "approve" }
get_job_logs = { approval_mode = "approve" }
get_label = { approval_mode = "approve" }
get_latest_release = { approval_mode = "approve" }
get_me = { approval_mode = "approve" }
get_release_by_tag = { approval_mode = "approve" }
get_tag = { approval_mode = "approve" }
get_team_members = { approval_mode = "approve" }
get_teams = { approval_mode = "approve" }
list_branches = { approval_mode = "approve" }
list_commits = { approval_mode = "approve" }
list_issue_fields = { approval_mode = "approve" }
list_issue_types = { approval_mode = "approve" }
list_issues = { approval_mode = "approve" }
list_pull_requests = { approval_mode = "approve" }
list_releases = { approval_mode = "approve" }
list_repository_collaborators = { approval_mode = "approve" }
list_tags = { approval_mode = "approve" }
search_code = { approval_mode = "approve" }
search_commits = { approval_mode = "approve" }
search_issues = { approval_mode = "approve" }
