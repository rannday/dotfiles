[features]
fast_mode = false
shell_snapshot = true
multi_agent = true
memories = true

[agents]
enabled = true
max_concurrent_threads_per_session = 3

[sandbox_workspace_write]
network_access = true
writable_roots = [
  "/home/rann/.cache/go-build",
  "/home/rann/go/tmp",
  "/home/rann/go/pkg/mod",
]

[mcp_servers.fff]
command = "fff-mcp"
enabled = true
default_tools_approval_mode = "approve"

[mcp_servers.desktop-commander]
default_tools_approval_mode = "prompt"
command = "npx"
args = ["-y", "@wonderwhy-er/desktop-commander@latest"]
startup_timeout_sec = 90
disabled_tools = [
  "start_search",
  "get_more_search_results",
  "list_searches",
  "stop_search",
  "edit_block",
  "get_prompts",
  "give_feedback_to_desktop_commander",
  "write_pdf",
]

# Observational tools only; mutations and ambiguous tools retain prompt approval.
[mcp_servers.desktop-commander.tools]
read_file = { approval_mode = "approve" }
read_multiple_files = { approval_mode = "approve" }
list_directory = { approval_mode = "approve" }
get_file_info = { approval_mode = "approve" }
list_processes = { approval_mode = "approve" }
list_sessions = { approval_mode = "approve" }
read_process_output = { approval_mode = "approve" }
get_config = { approval_mode = "approve" }
get_usage_stats = { approval_mode = "approve" }

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
bearer_token_env_var = "CONTEXT7_API_KEY"
default_tools_approval_mode = "approve"

[mcp_servers.gopls]
default_tools_approval_mode = "prompt"
command = "gopls"
args = ["mcp"]
startup_timeout_sec = 90

# Inspection and checks are approved; rename requests and unknown tools prompt.
[mcp_servers.gopls.tools]
