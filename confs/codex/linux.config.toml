[features]
fast_mode = false
shell_snapshot = true
multi_agent = true
memories = true

[agents]
enabled = true
max_concurrent_threads_per_session = 3

[sandbox_workspace_write]
network_access = true
writable_roots = [
  "/home/rann/.cache/go-build",
  "/home/rann/go/tmp",
  "/home/rann/go/pkg/mod",
]

[mcp_servers.fff]
command = "fff-mcp"
enabled = true
default_tools_approval_mode = "approve"

[mcp_servers.desktop-commander]
default_tools_approval_mode = "prompt"
command = "npx"
args = ["-y", "@wonderwhy-er/desktop-commander@latest"]
disabled_tools = [
  "start_search",
  "get_more_search_results",
  "list_searches",
  "stop_search",
  "edit_block",
  "get_prompts",
  "give_feedback_to_desktop_commander",
  "write_pdf",
]

