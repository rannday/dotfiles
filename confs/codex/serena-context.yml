description: Codex semantic code intelligence
prompt: |
  You are running in Codex. Follow ~/.codex/AGENTS.md for tool routing.
  Serena's read_file remains available as part of semantic work.
  Prefer symbols, declarations, references, and implementations when exploring
  code. Avoid whole-file reads unless necessary.
  Use Codex's internal tools for non-symbolic edits and shell commands.
excluded_tools:
  - create_text_file
  - execute_shell_command
  - replace_content
  - find_file
  - list_dir
tool_description_overrides: {}
