go_search = { approval_mode = "approve" }
go_symbol_references = { approval_mode = "approve" }
go_vulncheck = { approval_mode = "approve" }
go_workspace = { approval_mode = "approve" }

[mcp_servers.serena]
default_tools_approval_mode = "prompt"
command = "serena"
args = ["start-mcp-server", "--project-from-cwd", "--context=C:/Users/rannd/.codex/serena-context.yml"]
startup_timeout_sec = 90
disabled_tools = ["activate_project"]

