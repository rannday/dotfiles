model_reasoning_effort = "medium"
model_verbosity = "low"
model_auto_compact_token_limit = 80000
tool_output_token_limit = 12000
personality = "pragmatic"
web_search = "cached"
sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
developer_instructions = """
Follow ~/.codex/AGENTS.md for voice, tool routing, bounded discovery, permitted fallbacks, authorization, and secret protection.
"""

[tui]
theme = "gruvbox-dark"

[notice]
hide_rate_limit_model_nudge = true

[features]
fast_mode = false
shell_snapshot = true
multi_agent = true
memories = true
prefer_mxc = true

[shell_environment_policy]
include_only = [
  "PATH",
  "SystemRoot",
  "WINDIR",
  "LOCALAPPDATA",
  "APPDATA",
  "USERPROFILE",
  "TEMP",
  "TMP",
]

[windows]
sandbox = "elevated"

[agents]
enabled = true
max_concurrent_threads_per_session = 3

[sandbox_workspace_write]
network_access = true
writable_roots = [
  'C:\Users\rannd\AppData\Local\go-build',
  'C:\Users\rannd\go\tmp',
  'C:\Users\rannd\go\pkg\mod',
  'C:\Users\rannd\.cargo',
  'C:\Users\rannd\.rustup',
]

[mcp_servers.fff]
command = "fff-mcp"
enabled = true
default_tools_approval_mode = "approve"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
bearer_token_env_var = "CONTEXT7_API_KEY"
default_tools_approval_mode = "approve"

