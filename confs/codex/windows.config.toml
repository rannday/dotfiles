[features]
fast_mode = false
shell_snapshot = true
multi_agent = true
memories = true

[shell_environment_policy]
include_only = [
  "PATH",
  "SystemRoot",
  "WINDIR",
  "LOCALAPPDATA",
  "APPDATA",
  "USERPROFILE",
  "TEMP",
  "TMP",
]

[windows]
sandbox = "elevated"
#sandbox = "unelevated"

[agents]
enabled = true
max_concurrent_threads_per_session = 3

[sandbox_workspace_write]
network_access = true
writable_roots = [
  'C:\Users\rannd\AppData\Local\go-build',
  'C:\Users\rannd\go\tmp',
  'C:\Users\rannd\go\pkg\mod',
]

[mcp_servers.fff]
command = "fff-mcp"
enabled = true
default_tools_approval_mode = "approve"

[mcp_servers.desktop-commander]
default_tools_approval_mode = "prompt"
command = "npx"
args = ["-y", "@wonderwhy-er/desktop-commander@latest"]
startup_timeout_sec = 90
disabled_tools = [
  "start_search",
  "get_more_search_results",
  "list_searches",
  "stop_search",
  "edit_block",
  "get_prompts",
  "give_feedback_to_desktop_commander",
  "write_pdf",
]

