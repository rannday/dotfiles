# https://alacritty.org/config-alacritty.html

# https://github.com/rajasegar/alacritty-themes/tree/master/themes
[general]
import = [
  #"~/.config/alacritty/themes/nord.toml"
  "~/.config/alacritty/themes/github-dark.toml"
]

#tabspaces = 2

[window]
decorations = "full"
opacity = 0.8
dynamic_title = true
#gtk_theme_variant = "None"

[window.dimensions]
columns = 96
lines = 24

[scrolling]
history = 10000
multiplier = 3

[font]
size = 11.5

[font.normal]
family = "Source Code Pro"
style = "Regular"

[font.bold]
family = "Source Code Pro"
style = "Bold"

[font.italic]
family = "Source Code Pro"
style = "Italic"

[font.bold_italic]
family = "Source Code Pro"
style = "Bold Italic"

#[shell]
#program = "/bin/zsh"
#args = [ "-l", "-c", "tmux attach || tmux" ]
