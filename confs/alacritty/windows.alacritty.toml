# %APPDATA%\alacritty\alacritty.toml

[general]
import = [
  "themes\\themes\\gruvbox_material_hard_dark.toml"
]
working_directory = "C:\\Users\\RANND"
#live_config_reload = false

[window]
dimensions = { columns = 130, lines = 30 }
#resize_increments = true
#dynamic_title = false

[font]
size = 11.25
normal = { family = "Cascadia Mono", style = "Regular" }
bold = { family = "Cascadia Mono", style = "Bold" }
italic = { family = "Cascadia Mono", style = "Italic" }
bold_italic = { family = "Cascadia Mono", style = "Bold Italic" }

[cursor]
style = { shape = "Block", blinking = "Never" }
#vi_mode_style = { shape = "Block", blinking = "Never" }
#blink_timeout = 0
#unfocused_hollow = false

[terminal]
#osc52 = "Disabled"
#shell = { program = "C:\\Program Files\\PowerShell\\7\\pwsh.exe", args = ["-NoLogo"] }
shell = { program = "C:\\Program Files\\PowerShell\\7\\pwsh.exe", args = ["-NoLogo", "-Command", "zellij"] }
